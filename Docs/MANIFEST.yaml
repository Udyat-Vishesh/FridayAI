manifest_version: "1.1"

project:
  name: FRIDAY
  codename: Foundation
  version: "0.1.0"
  description: "Personal Local-First Modular Intelligence Platform"
  repository: "https://github.com/Udyat-Vishesh/FridayAI"

platform:
  type: Local-First
  architecture: Modular
  primary_language: Python
  operating_system:
    - Windows
  deployment:
    - Local

llm:
  default_provider: Ollama
  default_model: qwen3:8b

modules:
  - id: memory
    version: "0.1.0"
    path: Memory/

  - id: knowledge
    version: "0.1.0"
    path: Knowledge/

  - id: voice
    version: "0.1.0"
    path: Voice/

  - id: vision
    version: "0.1.0"
    path: Vision/

  - id: skills
    version: "0.1.0"
    path: Skills/

paths:
  brain: Brain/
  memory: Memory/
  knowledge: Knowledge/
  voice: Voice/
  vision: Vision/
  skills: Skills/
  projects: Projects/
  prompts: Prompts/
  config: Config/
  logs: Logs/
  backups: Backups/
  installers: Installers/
  docs: Docs/

documents:
  philosophy: Docs/PHILOSOPHY.md
  constitution: Docs/CONSTITUTION.md
  changelog: Docs/CHANGELOG.md

principles:
  - Learning
  - Research
  - Local-First
  - Transparency
  - Reliability
  - User-Control
  - Modularity
  - Maintainability

metadata:
  architecture_version: "0.1.0"
  created: "2026-07-30"
  last_updated: "2026-07-30"